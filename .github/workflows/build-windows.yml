name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GSMUnlockServiceTool.csproj
      - name: Publish self-contained Windows x64 EXE
        run: dotnet publish GSMUnlockServiceTool.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/app
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSMUnlockServiceTool-Windows-x64
          path: artifacts/app/
          if-no-files-found: error
          retention-days: 14
